<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 스타일 카메라 앱</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: white; overflow-x: hidden; }
        .canvas-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; }
        video, canvas { width: 100%; border-radius: 12px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [isCameraReady, setIsCameraReady] = useState(false);
            const [capturedImage, setCapturedImage] = useState(null);

            // 카메라 시작 로직
            useEffect(() => {
                async function setupCamera() {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                            setIsCameraReady(true);
                        }
                    } catch (err) {
                        console.error("카메라 접근 에러:", err);
                        alert("카메라 권한을 허용해주세요.");
                    }
                }
                setupCamera();
            }, []);

            const takePhoto = () => {
                const video = videoRef.current;
                const canvas = canvasRef.current;
                if (video && canvas) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    setCapturedImage(canvas.toDataURL('image/png'));
                }
            };

            return (
                <div className="flex flex-col items-center p-4 min-h-screen">
                    <header className="mb-6 text-center">
                        <h1 className="text-3xl font-bold text-yellow-400">AI STYLE CAMERA</h1>
                        <p className="text-sm text-gray-400">전시장에서 즐기는 AI 스타일 변환</p>
                    </header>

                    <div className="canvas-container shadow-2xl border-2 border-gray-700 p-2 bg-gray-900 rounded-xl">
                        {!capturedImage ? (
                            <video ref={videoRef} autoPlay playsInline />
                        ) : (
                            <img src={capturedImage} alt="Captured" className="rounded-lg" />
                        )}
                    </div>

                    <div className="mt-8 flex gap-4">
                        {!capturedImage ? (
                            <button 
                                onClick={takePhoto}
                                className="bg-white text-black px-8 py-4 rounded-full font-bold text-lg active:scale-95 transition-transform"
                            >
                                📸 사진 촬영
                            </button>
                        ) : (
                            <button 
                                onClick={() => setCapturedImage(null)}
                                className="bg-red-500 text-white px-8 py-4 rounded-full font-bold text-lg"
                            >
                                🔄 다시 찍기
                            </button>
                        )}
                    </div>

                    {/* 스타일 선택 영역 (예시) */}
                    <div className="mt-10 grid grid-cols-3 gap-3 w-full max-w-md">
                        {['고흐', '지브리', '수채화'].map(style => (
                            <button key={style} className="bg-gray-800 p-3 rounded-lg text-xs hover:bg-yellow-600 transition-colors">
                                {style} 스타일
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
